name: User Service CI

on:
  push:
    branches:
      - Main

  pull_request:
    branches:
      - Main

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: userdb_test

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SELECT 1;"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SHOW DATABASES;"

      - name: Run tests
        run: ./mvnw clean test

      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/user-service
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker push $IMAGE_NAME:${{ github.sha }}

  deploy:

    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/Main' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: dev
    steps:

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/deployment-config

            export USER_SERVICE_TAG=${{ inputs.image_tag || github.sha }}
            echo "Deploying user-service:$USER_SERVICE_TAG"
            docker compose pull user-service
            docker compose up -d --no-build user-service